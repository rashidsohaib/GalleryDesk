[package]
name = "gallerydesk"
version = "1.0.0"
description = "Offline-first Linux photo manager"
authors = ["Rashid Sohaib"]
edition = "2021"

[lib]
name = "gallerydesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "5"
kamadak-exif = "0.6"
sha2 = "0.10"
notify = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
